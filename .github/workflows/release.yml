name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

# NOTIFICATION: this workflow publishes. It creates a public GitHub release, pushes a commit to the
# tap repository, and posts to Discord. Nothing here runs on a pull request.
permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      # Import the persistent self-signed identity so releases carry a stable signature.
      # Without it build-app.sh falls back to ad-hoc, which is regenerated every build and
      # therefore invalidates the Keychain permission for environment secrets on every upgrade.
      - name: Import the signing identity
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "no signing identity configured; build-app.sh will use ad-hoc"; exit 0; fi
          echo "$P12" | base64 --decode > /tmp/nib.p12
          # A throwaway keychain, unlocked for this job only. Importing into the runner's login
          # keychain would leave the key sitting in a shared default.
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/nib.p12 -k build.keychain -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain >/dev/null
          rm -f /tmp/nib.p12

      # The version is declared in the tag, in Info.plist, on the website and in the tap. Only
      # the cask is rewritten automatically, so the other three drift. Catch it here rather than
      # shipping an app whose About box disagrees with the release it came from.
      - name: Check Info.plist matches the tag
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist)
          WANT="${{ steps.version.outputs.version }}"
          echo "tag says $WANT, Info.plist says $PLIST"
          [ "$PLIST" = "$WANT" ] || {
              echo "::error::App/Info.plist is $PLIST but the tag is v$WANT. Bump it and re-tag."
              exit 1
          }

      - name: Build
        run: ./Tools/build-app.sh --release

      # The size claim is in the README and on the website. A release that breaks it should not
      # ship, and finding out here is far better than finding out from a stranger with `du`.
      - name: Check the size budget
        run: ./Tools/check-size.sh

      # ------------------------------------------------------------------------------------
      # Signing.
      #
      # build-app.sh signs with the "Nib Self-Signed" identity when it is in the runner's
      # keychain, and ad-hoc when it is not. To get the stable identity on CI, import the .p12
      # produced by Tools/selfsign.sh from a secret before the build step. Notarizing later is
      # deliberately a small diff confined to this file: add the Developer ID import above, then
      #
      #   xcrun notarytool submit dist/Nib.zip --apple-id … --team-id … --password … --wait
      #   xcrun stapler staple dist/Nib.app
      #
      # and drop the `postflight` block from the cask. Nothing outside this workflow and the
      # tap needs to change. See docs/signing.md.
      # ------------------------------------------------------------------------------------

      - name: Zip it
        run: |
          cd dist
          # ditto rather than zip: it preserves the code signature and the bundle's symlinks.
          ditto -c -k --keepParent Nib.app Nib.zip
          shasum -a 256 Nib.zip | tee ../sha256.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cut -d' ' -f1 sha256.txt)
          SIZE=$(du -sk dist/Nib.app | cut -f1)
          cat > notes.md <<EOF
          ## Install

          \`\`\`sh
          brew trust --tap jasp-nerd/nib
          brew install --cask jasp-nerd/nib/nib
          \`\`\`

          Or download \`Nib.zip\` below. Nib is self-signed, so a manual download needs:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Nib.app
          \`\`\`

          The tap does this for you.

          ---

          ${SIZE} KB on disk · macOS 26+ · SHA-256 \`${SHA}\`
          EOF

          gh release create "${{ steps.version.outputs.tag }}" dist/Nib.zip \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md

      # Bumping the cask is a sed and a commit, on purpose. A release process with a manual step
      # in the middle is a release process that ships a stale cask.
      # A deploy key rather than a personal access token: it can write to the tap repository and
      # to nothing else, which is the whole of the access this step needs.
      - name: Bump the Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          SHA=$(cut -d' ' -f1 sha256.txt)
          VERSION="${{ steps.version.outputs.version }}"

          if [ -z "$DEPLOY_KEY" ]; then echo "no tap deploy key configured; skipping the cask bump"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone git@github.com:jasp-nerd/homebrew-nib.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' "s/  version \".*\"/  version \"${VERSION}\"/" Casks/nib.rb
          sed -i '' "s/  sha256 \".*\"/  sha256 \"${SHA}\"/"       Casks/nib.rb

          git config user.name  "nib-release"
          git config user.email "jasper.meijerink@outlook.com"
          git commit -am "nib ${VERSION}"
          git push

      - name: Announce
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "no webhook configured; not announcing"; exit 0; fi
          TAG="${{ steps.version.outputs.tag }}"
          curl -sS -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- <<EOF
          {"content": "Nib ${TAG} is out — https://github.com/${{ github.repository }}/releases/tag/${TAG}"}
          EOF
