name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: The request, as a cURL command
      description: >
        Use Copy as cURL (Redacted) — ⌥⇧⌘C. It strips credentials. This is far more useful than a
        description of the request, and much quicker than answering questions one at a time.
      render: shell
  - type: input
    id: version
    attributes:
      label: Nib version
      description: About Nib, or `brew info --cask nib`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
