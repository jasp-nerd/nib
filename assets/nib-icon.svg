<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nib">
  <!--
    The product mark on a rounded square, for places that want an app icon rather than a glyph:
    the README header, the og:image, the site nav.

    The gradient uses the one accent colour in the project (#8b7cf6, also the winning column on the
    comparison table). Two stops, no filters, no embedded raster — under a kilobyte, and it scales
    to any size for the same reason the app ships SF Symbols rather than bitmaps.
  -->
  <defs>
    <linearGradient id="nib-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d90f8"/>
      <stop offset="1" stop-color="#6d5ae0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#nib-bg)"/>
  <g transform="translate(20.8 20.8) scale(3.6)">
    <path fill="#ffffff" fill-rule="evenodd" d="M12 1.5 L17.4 5.4 C18.6 6.3 19.1 7.6 18.8 9 L12.8 22.2 A0.9 0.9 0 0 1 11.2 22.2 L5.2 9 C4.9 7.6 5.4 6.3 6.6 5.4 Z M12 6 A1.9 1.9 0 1 0 12 9.8 A1.9 1.9 0 1 0 12 6 Z M11.2 11.4 L12.8 11.4 L12 22.4 Z"/>
  </g>
</svg>
