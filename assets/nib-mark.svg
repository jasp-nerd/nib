<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" role="img" aria-label="Nib">
  <!--
    A fountain pen nib.

    Three things make it read as a nib rather than as a map pin, which is what the first two
    attempts looked like at 22px:

      1. Angular shoulders. A semicircular top is a pin; the straight diagonals from the point down
         to the shoulders are what a nib actually has.
      2. The slit reaches the tip and splits it. That is the defining feature of a nib, and the
         earliest draft stopped the slit short — which left a round shape with a dot in it.
      3. A long taper. Nibs are tall for their width.

    One path with `evenodd`, so the hole and the slit are cut out of the body rather than painted
    over it. That is what lets the same file be the favicon, the app icon and an inline glyph: it
    carries no background of its own and inherits `currentColor`.
  -->
  <path fill-rule="evenodd" d="M12 1.5 L17.4 5.4 C18.6 6.3 19.1 7.6 18.8 9 L12.8 22.2 A0.9 0.9 0 0 1 11.2 22.2 L5.2 9 C4.9 7.6 5.4 6.3 6.6 5.4 Z M12 6 A1.9 1.9 0 1 0 12 9.8 A1.9 1.9 0 1 0 12 6 Z M11.2 11.4 L12.8 11.4 L12 22.4 Z"/>
</svg>
